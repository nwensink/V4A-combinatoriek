<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinatoriek Meester - 12 Typen Oefenen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fffaf0;
        }
        .card {
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.2), 0 8px 10px -6px rgba(251, 191, 36, 0.1);
        }
        .btn-warm {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            transition: transform 0.1s ease, background 0.2s ease;
        }
        .btn-warm:hover {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        .btn-warm:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">

    <header class="w-full max-w-2xl mt-4 mb-6 text-center">
        <h1 class="text-4xl font-bold text-amber-900 mb-2 tracking-tight">Combinatoriek Meester</h1>
        <p class="text-amber-700 font-medium">Oefen met 12 verschillende typen combinatorische vraagstukken</p>
    </header>

    <main id="app" class="w-full max-w-2xl my-auto">
        <div class="card bg-white rounded-3xl p-6 md:p-10 relative overflow-hidden border border-amber-100">
            <!-- Question Text -->
            <div id="question-text" class="text-xl md:text-2xl text-gray-800 font-bold mb-6 leading-snug">
                Klaar om te beginnen met oefenen? Klik op de onderstaande knop.
            </div>

            <!-- Inputs and Actions -->
            <div class="space-y-4">
                <div id="input-container" class="relative hidden">
                    <input type="number" id="answer-input" placeholder="Typ je antwoord..." 
                        class="w-full border-2 border-amber-200 rounded-2xl py-4 px-6 text-xl focus:outline-none focus:border-amber-500 transition-colors bg-amber-50/20 font-bold text-gray-800">
                </div>
                
                <button id="submit-btn" class="w-full btn-warm text-white font-bold py-4 rounded-2xl text-lg shadow-lg hidden cursor-pointer">
                    Controleer Antwoord
                </button>

                <button id="start-btn" class="w-full btn-warm text-white font-bold py-4 rounded-2xl text-lg shadow-lg cursor-pointer">
                    Start Oefening
                </button>

                <!-- Feedback Area -->
                <div id="feedback-area" class="hidden rounded-2xl p-4 mt-4 text-center"></div>

                <button id="next-btn" class="hidden w-full bg-amber-900 hover:bg-black text-white font-bold py-4 rounded-2xl text-lg shadow-lg mt-4 cursor-pointer transition-colors">
                    Volgende Vraag →
                </button>
            </div>
        </div>

        <div class="mt-8 flex justify-center gap-12 text-amber-900 font-semibold bg-amber-100/60 py-4 px-8 rounded-2xl max-w-xs mx-auto border border-amber-200">
            <div class="text-center">
                <div id="score-correct" class="text-3xl font-extrabold text-green-700">0</div>
                <div class="text-xs uppercase tracking-wider opacity-75 font-bold">Goed</div>
            </div>
            <div class="h-10 w-px bg-amber-300 my-auto"></div>
            <div class="text-center">
                <div id="score-total" class="text-3xl font-extrabold text-amber-900">0</div>
                <div class="text-xs uppercase tracking-wider opacity-75 font-bold">Totaal</div>
            </div>
        </div>
    </main>

    <footer class="mt-8 text-xs text-amber-700 text-center opacity-80">
        Combinatoriek Oefentool &bull; Machten, Permutaties & Combinaties
    </footer>

    <script>
        const getalNaarTekst = (n) => {
            const woorden = ["nul", "één", "twee", "drie", "vier", "vijf", "zes", "zeven", "acht", "negen", "tien"];
            return n <= 10 ? woorden[n] : n;
        };

        // Helper functie voor de officiële wiskundige notatie van combinaties (n boven k)
        const binomHTML = (n, k) => `
            <span class="inline-flex items-center align-middle mx-1 font-serif">
                <span class="text-2xl font-light leading-none select-none text-gray-700" style="transform: scaleY(1.35); font-family: sans-serif;">(</span>
                <span class="inline-flex flex-col text-center text-sm font-sans font-bold leading-tight px-0.5">
                    <span>${n}</span>
                    <span>${k}</span>
                </span>
                <span class="text-2xl font-light leading-none select-none text-gray-700" style="transform: scaleY(1.35); font-family: sans-serif;">)</span>
            </span>
        `;

        const math = {
            factorial(n) {
                if (n === 0 || n === 1) return 1;
                let res = 1;
                for (let i = 2; i <= n; i++) res *= i;
                return res;
            },
            nCr(n, r) {
                if (r > n) return 0;
                return Math.round(this.factorial(n) / (this.factorial(r) * this.factorial(n - r)));
            },
            nPr(n, r) {
                if (r > n) return 0;
                return Math.round(this.factorial(n) / this.factorial(n - r));
            }
        };

        const generators = [
            // 0: Macht (Pincode)
            () => {
                const n = 6 + Math.floor(Math.random() * 4); 
                const k = 3 + Math.floor(Math.random() * 2); 
                const ans = Math.pow(n, k);
                return {
                    q: `Een pincode bestaat uit ${getalNaarTekst(k)} posities. Voor elke positie kun je kiezen uit de cijfers 1 tot en met ${n}. Herhaling is toegestaan.<br><br>Bereken hoeveel verschillende codes er mogelijk zijn.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt uit en je kan elk ding vaker kiezen, dus het is een macht.<br><br><strong>Berekening:</strong> ${n}<sup>${k}</sup> = ${ans}`
                };
            },
            // 1: Permutatie (Functies/Rangen)
            () => {
                const n = 8 + Math.floor(Math.random() * 5);
                const ans = math.nPr(n, 2);
                return {
                    q: `Een klas heeft ${getalNaarTekst(n)} leerlingen. Er wordt een bestuur gekozen van twee personen: één voorzitter en één penningmeester.<br><br>Bereken op hoeveel manieren dit bestuur gevormd kan worden.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt uit en je kan elk ding maximaal één keer kiezen, dus het is een permutatie.<br><br><strong>Berekening:</strong> ${n} · ${n-1} = ${ans}`
                };
            },
            // 2: Combinatie (2 uit n)
            () => {
                const n = 12 + Math.floor(Math.random() * 8);
                const ans = math.nCr(n, 2);
                return {
                    q: `Uit een team van ${getalNaarTekst(n)} sporters worden er twee gekozen om het veld op te ruimen.<br><br>Bereken hoeveel verschillende tweetallen er mogelijk zijn.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt niet uit, dus het is een combinatie.<br><br><strong>Berekening:</strong> ${binomHTML(n, 2)} = ${ans}`
                };
            },
            // 3: Combinatie (3 uit n)
            () => {
                const n = 7 + Math.floor(Math.random() * 4);
                const ans = math.nCr(n, 3);
                return {
                    q: `Je kiest drie verschillende soorten fruit uit een mand met ${getalNaarTekst(n)} verschillende fruitsoorten.<br><br>Bereken hoeveel verschillende combinaties van fruit er mogelijk zijn.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt niet uit, dus het is een combinatie.<br><br><strong>Berekening:</strong> ${binomHTML(n, 3)} = ${ans}`
                };
            },
            // 4: Productregel (Menu)
            () => {
                const a = 3 + Math.floor(Math.random() * 3);
                const b = 3 + Math.floor(Math.random() * 3);
                const c = 2 + Math.floor(Math.random() * 2);
                const ans = a * b * c;
                return {
                    q: `Een restaurant biedt een menu aan met ${getalNaarTekst(a)} voorgerechten, ${getalNaarTekst(b)} hoofdgerechten en ${getalNaarTekst(c)} nagerechten.<br><br>Bereken hoeveel verschillende 3-gangenmenu's er mogelijk zijn.`,
                    a: ans,
                    e: `Je maakt achter elkaar onafhankelijke keuzes uit verschillende categorieën, dus vermenigvuldig je de aantallen (productregel).<br><br><strong>Berekening:</strong> ${a} · ${b} · ${c} = ${ans}`
                };
            },
            // 5: Samengestelde Combinatie
            () => {
                const m = 4 + Math.floor(Math.random() * 3);
                const v = 4 + Math.floor(Math.random() * 3);
                const ans = math.nCr(m, 2) * math.nCr(v, 2);
                return {
                    q: `Voor een projectgroep worden 2 jongens en 2 meisjes gekozen. Er zijn ${getalNaarTekst(m)} jongens en ${getalNaarTekst(v)} meisjes beschikbaar.<br><br>Bereken hoeveel verschillende groepen er gevormd kunnen worden.`,
                    a: ans,
                    e: `Voor de jongens en de meisjes maakt de volgorde van kiezen niet uit (combinatie). Omdat je beide kiest, vermenigvuldig je de uitkomsten met elkaar.<br><br><strong>Berekening:</strong> ${binomHTML(m, 2)} · ${binomHTML(v, 2)} = ${math.nCr(m, 2)} · ${math.nCr(v, 2)} = ${ans}`
                };
            },
            // 6: Rooster-paden
            () => {
                const rechts = 3 + Math.floor(Math.random() * 2);
                const omhoog = 2 + Math.floor(Math.random() * 2);
                const totaal = rechts + omhoog;
                const ans = math.nCr(totaal, rechts);
                return {
                    q: `In een rooster moet je van linksonder naar rechtsboven lopen. Je zet in totaal ${getalNaarTekst(totaal)} stappen, waarvan ${getalNaarTekst(rechts)} naar rechts en de rest omhoog.<br><br>Bereken hoeveel verschillende kortste routes er mogelijk zijn.`,
                    a: ans,
                    e: `Van de in totaal ${totaal} stappen kies je er ${rechts} die naar rechts gaan. De volgorde waarin je die positie-keuzes maakt maakt niet uit, dus het is een combinatie.<br><br><strong>Berekening:</strong> ${binomHTML(totaal, rechts)} = ${ans}`
                };
            },
            // 7: Volledige permutatie (Faculteit)
            () => {
                const n = 4 + Math.floor(Math.random() * 2);
                const ans = math.factorial(n);
                return {
                    q: `Op een boekenplank worden ${getalNaarTekst(n)} verschillende boeken naast elkaar gezet.<br><br>Bereken op hoeveel manieren je deze boeken op een rij kunt rangschikken.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt uit en je kan elk ding maximaal één keer kiezen, dus het is een permutatie.<br><br><strong>Berekening:</strong> ${n}! = ${ans}`
                };
            },
            // 8: Vaasmodel
            () => {
                const rood = 4 + Math.floor(Math.random() * 3);
                const blauw = 3 + Math.floor(Math.random() * 3);
                const combRood = math.nCr(rood, 2);
                const combBlauw = math.nCr(blauw, 1);
                const ans = combRood * combBlauw;
                return {
                    q: `In een vaas zitten ${getalNaarTekst(rood)} rode en ${getalNaarTekst(blauw)} blauwe knikkers. Je pakt in één greep 3 knikkers uit de vaas.<br><br>Bereken op hoeveel manieren je precies 2 rode en 1 blauwe knikker kunt pakken.`,
                    a: ans,
                    e: `Per kleur maakt de volgorde van kiezen niet uit (combinatie). Beide keuzes vermenigvuldig je met elkaar.<br><br><strong>Berekening:</strong> ${binomHTML(rood, 2)} · ${binomHTML(blauw, 1)} = ${combRood} · ${combBlauw} = ${ans}`
                };
            },
            // 9: Selectie (k uit n)
            () => {
                const n = 8 + Math.floor(Math.random() * 6);
                const k = 2 + Math.floor(Math.random() * 2);
                const ans = math.nCr(n, k);
                return {
                    q: `Op een kaart staan ${getalNaarTekst(n)} verschillende gerechten. Je mag een schaal samenstellen met precies ${getalNaarTekst(k)} verschillende gerechten.<br><br>Bereken hoeveel verschillende schalen je kunt samenstellen.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt niet uit, dus het is een combinatie.<br><br><strong>Berekening:</strong> ${binomHTML(n, k)} = ${ans}`
                };
            },
            // 10: Onafhankelijke keuzes (Muntstukken)
            () => {
                const k = 4 + Math.floor(Math.random() * 3);
                const ans = Math.pow(2, k);
                return {
                    q: `Je gooit een eerlijk muntstuk ${getalNaarTekst(k)} keer achter elkaar. Voor elke worp is de uitkomst Kop of Munt.<br><br>Bereken hoeveel verschillende reeksen van uitkomsten er mogelijk zijn.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt uit en je kan elk ding vaker kiezen, dus het is een macht.<br><br><strong>Berekening:</strong> 2<sup>${k}</sup> = ${ans}`
                };
            },
            // 11: Codes zonder herhaling
            () => {
                const n = 7 + Math.floor(Math.random() * 3);
                const k = 3;
                const ans = math.nPr(n, k);
                return {
                    q: `Je maakt een geheime code van ${getalNaarTekst(k)} verschillende cijfers gekozen uit de cijfers 1 tot en met ${n}. Geen enkel cijfer mag dubbel gebruikt worden.<br><br>Bereken hoeveel verschillende codes er mogelijk zijn.`,
                    a: ans,
                    e: `De volgorde waarin je de dingen kiest maakt uit en je kan elk ding maximaal één keer kiezen, dus het is een permutatie.<br><br><strong>Berekening:</strong> ${n} · ${n-1} · ${n-2} = ${ans}`
                };
            }
        ];

        let currentQuestion = null;
        let score = 0;
        let totalAnswered = 0;
        let questionHistory = [];

        const app = {
            init() {
                document.getElementById('start-btn').addEventListener('click', () => this.start());
                document.getElementById('submit-btn').addEventListener('click', () => this.checkAnswer());
                document.getElementById('next-btn').addEventListener('click', () => this.generateNew());
                
                document.getElementById('answer-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkAnswer();
                });
            },

            start() {
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('input-container').classList.remove('hidden');
                document.getElementById('submit-btn').classList.remove('hidden');
                this.generateNew();
            },

            generateNew() {
                let genIndex;
                do {
                    genIndex = Math.floor(Math.random() * generators.length);
                } while (questionHistory.includes(genIndex) && questionHistory.length < generators.length);

                questionHistory.push(genIndex);
                if (questionHistory.length > 6) questionHistory.shift();

                currentQuestion = generators[genIndex]();
                document.getElementById('question-text').innerHTML = currentQuestion.q;

                // Reset Inputs
                const input = document.getElementById('answer-input');
                input.value = '';
                input.disabled = false;
                input.focus();
                
                document.getElementById('feedback-area').classList.add('hidden');
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('submit-btn').classList.remove('hidden');
            },

            checkAnswer() {
                const val = document.getElementById('answer-input').value.trim();
                if (!val) return;

                const userAnswer = parseInt(val, 10);
                if (userAnswer === currentQuestion.a) {
                    this.showSuccess();
                } else {
                    this.showFailure(currentQuestion.e);
                }
            },

            showSuccess() {
                score++;
                totalAnswered++;
                this.updateStats();
                const feedbackArea = document.getElementById('feedback-area');
                feedbackArea.innerHTML = `<span class="text-green-700 font-bold text-lg">🎉 Uitstekend! Dat is juist.</span>`;
                feedbackArea.className = "rounded-2xl p-4 mt-4 text-center bg-green-50 border-2 border-green-300";
                feedbackArea.classList.remove('hidden');
                
                document.getElementById('answer-input').disabled = true;
                document.getElementById('submit-btn').classList.add('hidden');
                
                setTimeout(() => this.generateNew(), 1200);
            },

            showFailure(explanation) {
                totalAnswered++;
                this.updateStats();
                const feedbackArea = document.getElementById('feedback-area');
                feedbackArea.innerHTML = `
                    <div class="text-red-600 font-bold text-lg mb-2">Helaas, dat is niet juist.</div>
                    <div class="flex flex-wrap justify-center gap-2 my-3">
                        <button id="retry-btn" type="button" class="px-4 py-2 bg-amber-200 hover:bg-amber-300 text-amber-900 rounded-xl font-bold text-sm transition-colors cursor-pointer">
                            🔄 Probeer opnieuw
                        </button>
                        <button id="show-solution-btn" type="button" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-800 rounded-xl font-bold text-sm transition-colors cursor-pointer">
                            💡 Bekijk uitwerking
                        </button>
                    </div>
                    <div id="solution-detail" class="hidden mt-3 p-3 bg-white/80 rounded-xl text-left text-gray-800 text-sm border border-red-200 font-medium leading-relaxed">
                        <strong>Volledige uitwerking:</strong><br>${explanation}
                    </div>
                `;
                feedbackArea.className = "rounded-2xl p-4 mt-4 text-center bg-red-50 border-2 border-red-200";
                feedbackArea.classList.remove('hidden');
                
                document.getElementById('answer-input').disabled = true;
                document.getElementById('submit-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');

                document.getElementById('retry-btn').addEventListener('click', () => {
                    document.getElementById('answer-input').disabled = false;
                    document.getElementById('answer-input').value = '';
                    document.getElementById('answer-input').focus();
                    feedbackArea.classList.add('hidden');
                    document.getElementById('submit-btn').classList.remove('hidden');
                    document.getElementById('next-btn').classList.add('hidden');
                });

                document.getElementById('show-solution-btn').addEventListener('click', () => {
                    const sol = document.getElementById('solution-detail');
                    sol.classList.toggle('hidden');
                });
            },

            updateStats() {
                document.getElementById('score-correct').innerText = score;
                document.getElementById('score-total').innerText = totalAnswered;
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
